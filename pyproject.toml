[project]
name = "numba-enzyme"
version = "0.1.3"
description = "Differentiate Numba-compiled Python functions with Enzyme."
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
authors = [
    { name = "Yousof Mardoukhi" },
]
requires-python = ">=3.11"
dependencies = [
    "llvmlite>=0.50.0,<0.51",
    "numba>=0.68.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/EnzymeAD/numba-enzyme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numba_enzyme"]

# `src/numba_enzyme/_vendor/` is optional and absent for editable dev installs;
# `hatch_build.py` dynamically includes `libNumbaEnzyme` when present (while
# official release wheels are built directly with Bazel via `//:wheel`).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    "bazel-*",
    "dist",
    "enzyme-build",
    "enzyme-src",
    "wheelhouse",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",
    "SA01",
    "EX01",
]
exclude = [
    '\.__init__$',
    '\.__call__$',
    'test_*',
]

[dependency-groups]
dev = [
    "numpydoc>=1.10.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]
