[project]
name = "numba-enzyme"
version = "0.1.3"
description = "Differentiate Numba-compiled Python functions with the standalone Enzyme LLVM plugin."
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
authors = [
    { name = "Yousof Mardoukhi" },
]
requires-python = ">=3.11"
dependencies = [
    "llvmlite==0.44.0",
    "numba==0.61.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/Qruise-ai/numba-enzyme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numba_enzyme"]

# _vendor/ is populated at wheel-build time by packaging/cibw_before_build.sh
# (never committed to git, and absent for a normal dev-mode/editable install).
# A *static* force-include would break the dev-mode build, since hatchling
# requires force-included files to exist unconditionally -- hatch_build.py
# adds them dynamically, only when _vendor/ is actually present. The
# resulting file layout was verified locally via a manual spike wheel; the
# hook itself is unverified until a real cibuildwheel run populates _vendor/
# for real (no docker in the authoring sandbox).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# UNVERIFIED end-to-end (no docker in the authoring sandbox). The custom
# manylinux-x86_64-image must be built locally (`docker build -f
# packaging/Dockerfile.manylinux -t numba-enzyme-manylinux .`) or pushed to
# a registry the CI runner can pull before this works -- see
# .github/workflows/wheels.yml.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *win32* *macosx*"
before-all = "bash {project}/packaging/cibw_before_all.sh"
before-build = "bash {project}/packaging/cibw_before_build.sh {project}"
test-command = "python -c \"import numba_enzyme\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "numba-enzyme-manylinux"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",
    "SA01",
    "EX01",
]
exclude = [
    '\.__init__$',
    '\.__call__$',
    'test_*',
]

[dependency-groups]
dev = [
    "numpydoc>=1.10.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
