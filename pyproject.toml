[project]
# The CUDA-enabled fork, published separately because upstream's release has no
# CUDA backend and PyPI metadata cannot point at a fork's release asset. It
# still provides the `numba_enzyme` import package, so it is a drop-in
# replacement and the two distributions must not be installed together. The
# version is this distribution's own: it carries upstream 0.1.3 plus the CUDA
# backend and the composable, tuple-shaped `jvp` menodax drove.
name = "numba-enzyme-cuda"
version = "0.2.0"
description = "Differentiate Numba-compiled Python and CUDA device functions with the standalone Enzyme LLVM plugin."
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
authors = [
    { name = "Yousof Mardoukhi" },
]
requires-python = ">=3.11"
dependencies = [
    # The CPU driver is written against these; the CUDA backend only touches
    # llvmlite.ir and numba's version string, so newer releases work there and
    # the exact pins would otherwise force a downgrade on any CUDA consumer.
    "llvmlite>=0.44",
    "numba>=0.61",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
cuda = [
    "numba-cuda-mlir>=0.5.1,<0.6",
]

[project.urls]
Repository = "https://github.com/lawrenceberry/numba-enzyme"
Upstream = "https://github.com/Qruise-ai/numba-enzyme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numba_enzyme"]

# _vendor/ holds the LLVM 15 + Enzyme binaries the derivative pipeline
# shells out to. It is never committed. Under cibuildwheel it is populated
# by packaging/cibw_before_build.sh; for any other build -- notably a
# `uv add`/`pip install` from the git URL -- hatch_build.py downloads the
# released PyPI wheel and reuses the binaries it already carries, so the
# git source installs on its own rather than producing a wheel that fails
# at the first differentiation. A *static* force-include cannot express
# either case, since hatchling requires force-included files to exist
# unconditionally, so the hook adds them once _vendor/ is present.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# UNVERIFIED end-to-end (no docker in the authoring sandbox). The custom
# manylinux-x86_64-image must be built locally (`docker build -f
# packaging/Dockerfile.manylinux -t numba-enzyme-manylinux .`) or pushed to
# a registry the CI runner can pull before this works -- see
# .github/workflows/wheels.yml.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *win32* *macosx*"
before-all = "bash {project}/packaging/cibw_before_all.sh"
before-build = "bash {project}/packaging/cibw_before_build.sh {project}"
test-command = "python -c \"import numba_enzyme\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "numba-enzyme-manylinux"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",
    "SA01",
    "EX01",
]
exclude = [
    '\.__init__$',
    '\.__call__$',
    'test_*',
]

[dependency-groups]
dev = [
    "numba-cuda-mlir[cu12]>=0.5.1,<0.6",
    "numpydoc>=1.10.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
