name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  detect-changes:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/detect-changes.yml

  lint:
    name: Pre-commit
    needs: [detect-changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       needs.detect-changes.outputs.tests-relevant == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    name: Test - ${{ matrix.os }}
    needs: [detect-changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       needs.detect-changes.outputs.tests-relevant == 'true')
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ (contains(matrix.os, 'ubuntu') && 'ghcr.io/enzymead/reactant-docker-images_22.04@sha256:3a4edb524a77b28cffdb9589fa23d0e4a43fec7da85f531e92ff6803fd62106f') || '' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macOS-latest
    timeout-minutes: 180
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -euo pipefail
          BAZEL_FLAGS=""
          if [ "${{ runner.arch }}" = "ARM64" ] && [ "${{ runner.os }}" = "Linux" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --linkopt=-fuse-ld=lld"
          fi
          if command -v clang >/dev/null 2>&1; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=$(command -v clang)"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --cxxopt=-Wno-nullability-completeness --host_cxxopt=-Wno-nullability-completeness"
          fi
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os == 'macOS' && format('test-{0}-{1}-3.11', github.workflow, matrix.os) || format('test-{0}-{1}', github.workflow, matrix.os) }}
          cache-save: true
          repository-cache: true
          bazelisk-version: 1.x

      - name: Run Bazel test suite (Python 3.11 - 3.15)
        shell: bash
        run: |
          set -euo pipefail
          for py in 3.11 3.12 3.13 3.14 3.15; do
            echo "=== Testing with HERMETIC_PYTHON_VERSION=${py} ==="
            HERMETIC_PYTHON_VERSION="${py}" bazel test $BAZEL_FLAGS \
              --color=yes \
              --test_output=errors \
              --experimental_ui_max_stdouterr_bytes=-1 \
              --test_verbose_timeout_warnings \
              //tests:python_tests
          done

      - name: Build wheel
        shell: bash
        run: |
          HERMETIC_PYTHON_VERSION="3.11" bazel build $BAZEL_FLAGS --color=yes //:wheel
