name: Detect changes
# Reusable workflow: computes whether files relevant to the test suite
# changed in this pull request.

on:
  workflow_call:
    outputs:
      tests-relevant:
        description: Whether files relevant to the test suite changed.
        value: ${{ jobs.detect.outputs.tests-relevant }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tests-relevant: ${{ steps.filter.outputs.tests-relevant }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tests-relevant:
              - 'src/**'
              - 'tests/**'
              - 'builddeps/**'
              - 'patches/**'
              - 'third_party/**'
              - 'packaging/**'
              - '**/BUILD'
              - 'WORKSPACE'
              - '**/*.bzl'
              - '.bazelrc'
              - '.bazelversion'
              - 'multitool.lock.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/tests.yml'
              - '.github/workflows/detect-changes.yml'
