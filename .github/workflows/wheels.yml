name: Build and publish wheels

# Not on tags: release.yml owns those, and two workflows uploading one version
# would race. This one stays for building the toolchain from source in the
# manylinux image, and for TestPyPI.
on:
  workflow_dispatch:

jobs:
  build-image:
    name: Build manylinux container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Cached via GHA's own cache backend -- the image build compiles
      # three CPython versions from source, expensive enough to be
      # worth caching aggressively between runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile.manylinux
          tags: numba-enzyme-manylinux:latest
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for later jobs
        run: docker save numba-enzyme-manylinux:latest -o /tmp/numba-enzyme-manylinux.tar

      - uses: actions/upload-artifact@v4
        with:
          name: manylinux-image
          path: /tmp/numba-enzyme-manylinux.tar
          retention-days: 1

  build-wheels:
    name: Build wheels
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: manylinux-image
          path: /tmp

      - name: Load manylinux image
        run: docker load -i /tmp/numba-enzyme-manylinux.tar

      # Pinned to the exact version (4.1.1) for cp39-cp39
      # compatibility.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: numba-enzyme-manylinux:latest

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Report wheel sizes
        run: ls -lh wheelhouse/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-wheels
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/numba-enzyme-cuda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheelhouse

  # Kept for a from-source release done by hand; the tag path is release.yml.
  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    if: false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/numba-enzyme-cuda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: wheelhouse
