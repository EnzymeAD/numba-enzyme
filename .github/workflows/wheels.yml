name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheel - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ (contains(matrix.os, 'linux') && 'ghcr.io/enzymead/reactant-docker-images_22.04@sha256:3a4edb524a77b28cffdb9589fa23d0e4a43fec7da85f531e92ff6803fd62106f') || '' }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - linux-x86-n4-32
          - linux-arm64-c4a-32
          - macOS-latest
    timeout-minutes: 240
    env:
      HERMETIC_PYTHON_VERSION: "3.11"
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -euo pipefail
          BAZEL_FLAGS=""
          if [ "${{ runner.arch }}" = "ARM64" ] && [ "${{ runner.os }}" = "Linux" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --linkopt=-fuse-ld=lld"
          fi
          if command -v clang >/dev/null 2>&1; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=$(command -v clang)"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache_push"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --cxxopt=-Wno-nullability-completeness --host_cxxopt=-Wno-nullability-completeness"
          fi
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os == 'macOS' && format('wheel-{0}-{1}', github.workflow, matrix.os) || false }}
          restore-keys: ${{ runner.os == 'macOS' && format('wheel-{0}-', github.workflow) || false }}
          repository-cache: true
          save-always: true
          bazelisk-version: 1.x

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Setting package version to ${TAG}"
          sed -i.bak "s~version = \"[0-9][0-9.]*\"~version = \"${TAG}\"~g" BUILD pyproject.toml
          sed -i.bak "s~__version__ = \"[0-9][0-9.]*\"~__version__ = \"${TAG}\"~g" src/numba_enzyme/__init__.py
          rm -f BUILD.bak pyproject.toml.bak src/numba_enzyme/__init__.py.bak

      - name: Build wheel
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:wheel

      - name: Collect wheel
        shell: bash
        run: |
          mkdir -p wheelhouse
          cp -v bazel-bin/numba_enzyme-*.whl wheelhouse/
          ls -lh wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  smoke-test-wheels:
    name: Smoke test wheel - ${{ matrix.os }} - Python ${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
          - linux-arm64-c4a-32
          - macOS-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse

      - uses: astral-sh/setup-uv@v6

      - name: Install wheel into clean Python ${{ matrix.python }} venv and run smoke + pytest
        shell: bash
        run: |
          WHEEL="$(pwd)/$(ls wheelhouse/numba_enzyme-*.whl)"
          SMOKE_SCRIPT="$(pwd)/packaging/smoke_test.py"
          cp -r tests /tmp/smoke-tests
          uv venv --python "${{ matrix.python }}" /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python "${WHEEL}" pytest numpy
          cd /tmp
          /tmp/smoke-venv/bin/python "${SMOKE_SCRIPT}"
          /tmp/smoke-venv/bin/pytest -v /tmp/smoke-tests -k "not test_import"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-wheels, smoke-test-wheels]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/numba-enzyme
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheelhouse

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, smoke-test-wheels]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/numba-enzyme
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: wheelhouse
